name: Build Windows app
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pwsh packaging/build_win.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: PTZ-Tracker-windows
          path: dist/PTZ-Tracker-windows.zip
