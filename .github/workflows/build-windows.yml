name: Build Windows app
on:
  workflow_dispatch:
  push:
    tags: ["v*-windows"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version from tag
        shell: pwsh
        run: |
          $v = "1.1.0"
          if ("${{ github.ref }}" -match "refs/tags/v([0-9.]+)") { $v = $Matches[1] }
          "PTZ_VERSION=$v" >> $env:GITHUB_ENV
      - name: Install Inno Setup
        shell: pwsh
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - run: pwsh packaging/build_win.ps1
      - name: Smoke test the built app (NDI loads, detector runs, video reaches the window)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath "dist\PTZ Tracker\PTZ Tracker.exe" -ArgumentList "--selftest", "$PWD\selftest.txt" -PassThru -Wait
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { Get-Content "$env:LOCALAPPDATA\PTZ Tracker\Logs\app.log" -ErrorAction SilentlyContinue; exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: PTZ-Tracker-windows
          path: |
            dist/PTZ-Tracker-windows.zip
            dist/PTZ-Tracker-Setup.exe
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PTZ-Tracker-Setup.exe
            dist/PTZ-Tracker-windows.zip
          body_path: packaging/RELEASE_NOTES_WINDOWS.md
